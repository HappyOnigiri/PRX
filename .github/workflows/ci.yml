name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go, web, and browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install static analysis and browser tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Run complete verification
        run: make ci
      - name: Verify CI is read-only
        run: |
          git diff --exit-code || {
            echo "::error::make ci produced tracked file changes."
            git diff --stat
            exit 1
          }
      - name: Upload graph screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-screenshots
          path: test-results/screenshots
          if-no-files-found: warn
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
