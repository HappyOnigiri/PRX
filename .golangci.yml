version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - lll
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - protogetter
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - unconvert
    - usestdlibvars
    - wastedassign
    - funlen
    - cyclop

  settings:
    exhaustive:
      default-signifies-exhaustive: false
      check:
        - switch
        - map
    lll:
      line-length: 120
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    cyclop:
      max-complexity: 15

  exclusions:
    rules:
      - path: _test\.go
        # cyclop v2 removed skip-tests; this preserves its intended scope.
        linters: [funlen, cyclop]
      - path: internal/rpc/convert\.go
        linters: [cyclop]
        # enum-to-enum conversions are flat switches; splitting them hides the mapping

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    golines:
      max-len: 120
      tab-len: 4
      reformat-tags: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
