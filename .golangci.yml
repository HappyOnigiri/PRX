version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errchkjson
    - errorlint
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - unconvert
    - usestdlibvars
    - wastedassign
    - funlen
    - cyclop

  settings:
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    cyclop:
      max-complexity: 15

  exclusions:
    rules:
      - path: _test\.go
        # cyclop v2 removed skip-tests; this preserves its intended scope.
        linters: [funlen, cyclop]
      - path: internal/rpc/convert\.go
        linters: [cyclop]
        # enum-to-enum conversions are flat switches; splitting them hides the mapping

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
