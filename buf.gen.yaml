version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  - local: [corepack, pnpm@11.24.0, --dir, web, exec, protoc-gen-es]
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
